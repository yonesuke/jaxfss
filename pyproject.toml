[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jaxfss"
version = "0.1.0"
description = "JAX/Flax implementation of finite-size scaling"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Ryosuke Yoneda", email = "13e.e.c.13@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.0",
    "flax>=0.7.0",
    "optax>=0.1.5",
    "distrax>=0.1.3",
    "rationalnets>=0.1.0",
    "softclip>=0.1.0",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "matplotlib>=3.5.0",
]
docs = [
    "jupyter-book>=0.13.0",
    "matplotlib>=3.5.0",
]

[project.urls]
Homepage = "https://github.com/yonesuke/jaxfss"
Documentation = "https://yonesuke.github.io/jaxfss/"
Repository = "https://github.com/yonesuke/jaxfss"

[tool.hatch.build.targets.wheel]
packages = ["src/jaxfss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
